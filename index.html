<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sean Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav>
    <a class="nav-logo" href="#s-home">Sean</a>
    <div class="nav-links">
      <a href="#s-home">Home</a>
      <a href="#s-projects">Projects</a>
      <a href="#s-contact">Contact</a>
    </div>
  </nav>

  <div class="section section-home" id="s-home">
    <div class="hero-inner">
      <span class="static">Hi, I'm</span>
      <span class="title-wrapper">
        <span class="ghost">a developer</span>
        <span id="title">Sean</span>
      </span>
    </div>
  </div>

  <div class="section section-dark" id="s-projects">
    <div class="page-heading">Projects</div>
    <div class="projects-grid">
      <div class="project-card">
        <div class="project-tag">Web Design</div>
        <div class="project-title">Project One</div>
        <div class="project-year">2024</div>
      </div>
      <div class="project-card">
        <div class="project-tag">Development</div>
        <div class="project-title">Project Two</div>
        <div class="project-year">2024</div>
      </div>
      <div class="project-card">
        <div class="project-tag">Branding</div>
        <div class="project-title">Project Three</div>
        <div class="project-year">2023</div>
      </div>
      <div class="project-card">
        <div class="project-tag">Creative</div>
        <div class="project-title">Project Four</div>
        <div class="project-year">2023</div>
      </div>
    </div>
  </div>

  <div class="section section-mid" id="s-contact">
    <div class="page-heading">Contact</div>
    <div class="contact-wrap">
      <div class="contact-item">
        <span class="contact-label">Email</span>
        <span class="contact-value">hello@sean.com</span>
      </div>
      <div class="contact-item">
        <span class="contact-label">Twitter</span>
        <span class="contact-value">@sean</span>
      </div>
      <div class="contact-item">
        <span class="contact-label">LinkedIn</span>
        <span class="contact-value">in/sean</span>
      </div>
      <div class="contact-item">
        <span class="contact-label">Location</span>
        <span class="contact-value">New York, NY</span>
      </div>
    </div>
  </div>

  <script>
    const titles = ["Sean", "a designer", "a developer", "a creative", "a human"];
    let index = 0;
    const el = document.getElementById("title");

    setInterval(() => {
      el.style.opacity = 0;
      el.style.transform = "translateY(10px)";
      setTimeout(() => {
        index = (index + 1) % titles.length;
        el.textContent = titles[index];
        el.style.opacity = 1;
        el.style.transform = "translateY(0)";
      }, 300);
    }, 1800);
  </script>
</body>
</html>
