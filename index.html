<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sean</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Fixed gradient — scroll-reactive -->
  <div class="gradient-bg" id="gradient-bg"></div>
  <div class="edge-l"></div>
  <div class="edge-r"></div>
  <div class="edge-t"></div>
  <div class="edge-b"></div>

  <!-- ── HERO ── -->
  <section class="s-hero">
    <div class="hero-inner">
      <span class="s-static">Hi, I'm</span>
      <span class="title-wrapper">
        <span class="ghost">a developer</span>
        <span id="title">Sean</span>
      </span>
    </div>
  </section>

  <!-- ── PROJECTS ── -->
  <section class="s-projects">
    <div class="proj-stage">
      <div class="spotlight-radial"></div>

      <!-- LEFT -->
      <div class="proj-col proj-col-left">
        <div class="proj-item active" data-index="0">
          <div class="ptag">Web Design</div>
          <div class="ptitle">Project One</div>
          <div class="pyear">2024</div>
        </div>
        <div class="proj-item" data-index="1">
          <div class="ptag">Development</div>
          <div class="ptitle">Project Two</div>
          <div class="pyear">2024</div>
        </div>
      </div>

      <!-- CENTER arch -->
      <div class="arch-col">
        <div class="arch">
          <!-- Replace with: <video src="sean.mp4" autoplay muted playsinline id="sean-video"></video> -->
          <div class="arch-placeholder">
            <svg width="22" height="22" fill="none" stroke="#9aa0ad" stroke-width="1.5" viewBox="0 0 24 24"><path d="M15 10l4.553-2.277A1 1 0 0121 8.723v6.554a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/></svg>
            <span>your video</span>
          </div>
        </div>
        <span class="arch-label" id="arch-label">hover a project</span>
      </div>

      <!-- RIGHT -->
      <div class="proj-col proj-col-right">
        <div class="proj-item" data-index="2">
          <div class="ptag">Branding</div>
          <div class="ptitle">Project Three</div>
          <div class="pyear">2023</div>
        </div>
        <div class="proj-item" data-index="3">
          <div class="ptag">Creative</div>
          <div class="ptitle">Project Four</div>
          <div class="pyear">2023</div>
        </div>
      </div>
    </div>
  </section>

  <!-- ── CONTACT ── -->
  <section class="s-contact">

    <div class="contact-headline">Get<br>in touch</div>

    <div class="contact-links">
      <a class="contact-row" href="mailto:seanmapuke1@gmail.com">
        <span class="contact-row-label">Email</span>
        <span class="contact-row-value">seanmapuke1@gmail.com</span>
      </a>
      <a class="contact-row" href="https://github.com/seanmapuke" target="_blank">
        <span class="contact-row-label">GitHub</span>
        <span class="contact-row-value">seanmapuke</span>
      </a>
      <a class="contact-row" href="https://linkedin.com/in/seanmapuke" target="_blank">
        <span class="contact-row-label">LinkedIn</span>
        <span class="contact-row-value">in/seanmapuke</span>
      </a>
    </div>

    <div class="contact-location">
      <div class="location-dot"></div>
      Dallas, TX
    </div>
  </section>

  <script src="main.js"></script>
</body>
</html>
