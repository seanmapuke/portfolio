<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sean Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav>
    <a class="nav-logo" href="index.html">Sean</a>
    <div class="nav-links">
      <a href="index.html" class="active">Home</a>
      <a href="projects.html">Projects</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <div class="hero">
    <div class="hero-inner">
      <span class="static">Hi, I'm</span>
      <span class="title-wrapper">
        <span class="ghost">a developer</span>
        <span id="title">Sean</span>
      </span>
    </div>
  </div>

  <script>
    const titles = ["Sean", "a designer", "a developer", "a creative", "a human"];
    let index = 0;
    const el = document.getElementById("title");

    setInterval(() => {
      el.style.opacity = 0;
      el.style.transform = "translateY(10px)";
      setTimeout(() => {
        index = (index + 1) % titles.length;
        el.textContent = titles[index];
        el.style.opacity = 1;
        el.style.transform = "translateY(0)";
      }, 300);
    }, 1800);
  </script>
</body>
</html>
