<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sean Portfolio</title>

  <style>
    body {
      background: #f7f4ef;
      font-family: Arial, sans-serif;
      padding: 100px;
    }

    h1 {
      font-size: 64px;
      font-weight: 500;
      line-height: 1.2;
      color: #111;
    }

    #title {
      font-weight: 700;
      transition: opacity 0.3s ease, transform 0.3s ease;
      display: inline-block;
    }
  </style>
</head>

<body>

  <h1>
    Hi, I'm <span id="title"> Sean</span>
  </h1>

  <script>
    const titles = [
      "Sean",
      "a designer",
      "a developer",
      "a creative",
      "a human"
    ];

    let index = 0;
    const el = document.getElementById("title");

    setInterval(() => {
      el.style.opacity = 0;
      el.style.transform = "translateY(10px)";

      setTimeout(() => {
        index = (index + 1) % titles.length;
        el.textContent = titles[index];

        el.style.opacity = 1;
        el.style.transform = "translateY(0)";
      }, 300);

    }, 1800);
  </script>

</body>
</html>
