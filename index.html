<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sean</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

  <div id="cursor"></div>

  <div id="loader">
    <div id="loader-name">Sean Mapuke</div>
  </div>

  <nav class="nav-home">
    <div class="nav-links">
      <a href="projects.html">Projects</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <section class="s-room">
    <div class="room-img-wrap">
      <img id="room-img" src="Untitled.png" alt="Sean's Room" />

      <div class="room-header">
        <h1 class="room-title">Hi I'm Sean</h1>
        <p class="room-sub">Welcome to my space</p>
      </div>

      <div class="room-hint">explore the room</div>

      <div class="room-vignette"></div>

      <!-- 1. Phone on nightstand → contact.html -->
      <div class="dot-wrap" style="left:85.00%;top:78.00%;" data-href="contact.html" data-label="Contact Me">
        <div class="dot"></div>
        <div class="dot-label">Contact Me</div>
      </div>

      <!-- 2. Clothes pile → mnyfces.com -->
      <div class="dot-wrap" style="left:56.10%;top:90.39%;" data-href="https://mnyfces.com" data-external="true" data-label="mnyfces.com">
        <div class="dot"></div>
        <div class="dot-label">mnyfces.com</div>
      </div>

      <!-- 3. Monitor → projects.html -->
      <div class="dot-wrap" style="left:26.14%;top:39.00%;" data-href="projects.html" data-label="Professional Projects">
        <div class="dot"></div>
        <div class="dot-label">Professional Projects</div>
      </div>

      <!-- 4. Vinyl player → Spotify -->
      <div class="dot-wrap" style="left:59.00%;top:33.67%;" data-type="spotify" data-label="What I'm Listening To">
        <div class="dot"></div>
        <div class="dot-label">What I'm Listening To</div>
      </div>

      <!-- 5. Orange hard drive → artistic projects -->
      <div class="dot-wrap" style="left:27.20%;top:42.87%;" data-href="projects.html#art" data-label="Creative Projects">
        <div class="dot"></div>
        <div class="dot-label">Creative Projects</div>
      </div>

      <!-- 6. Window / lamp → day/night toggle -->
      <div class="dot-wrap" style="left:3.50%;top:69.50%;" data-type="daynight" data-label="Day / Night">
        <div class="dot"></div>
        <div class="dot-label" id="daynight-label">Switch to Day</div>
      </div>

    </div>
  </section>

  <div id="spotify-panel">
    <div class="sp-close" id="sp-close">[ close ]</div>
    <div class="sp-header">Now Playing</div>
    <div id="sp-content"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
