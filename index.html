<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sean</title>
  <link rel="preload" as="image" href="NIGHTTIME.webp">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&family=Inter:wght@700&display=swap" rel="stylesheet">
</head>
<body>

  <div id="cursor"></div>

  <div id="loader">
    <div id="loader-name">Sean Mapuke</div>
  </div>

  <nav class="nav-home">
  <div class="nav-links">
    <a href="creativeprojects.html#about-me">About Me</a>
    <a href="projects.html">Projects</a>
    <a href="creativeprojects.html#contact-resume">Contact</a>
  </div>
</nav>

  <section class="s-room">
    <div class="room-img-wrap">
      <img id="room-img" src="NIGHTTIME.webp" alt="Sean's Room" />

      <div class="room-hint">explore the room</div>

      <!-- Corner tag: location / date / time -->
      <div class="corner-tag" id="corner-tag">
        <div class="corner-tag-line" id="ct-location">Location: My Actual Room</div>
        <div class="corner-tag-line" id="ct-date"></div>
        <div class="corner-tag-line" id="ct-time-live"></div>
      </div>

      <div class="room-vignette"></div>

      <!-- 1. Contact Me -->
      <div class="dot-wrap" style="left:90.60%;top:77.83%;--pop-delay:1.7s;" data-href="creativeprojects.html#contact-resume" data-label="Contact Me">
        <div class="dot"></div>
        <div class="dot-label">Contact Me</div>
      </div>

      <!-- 2. Manyfaces → mnyfces.com -->
      <div class="dot-wrap" style="left:59.79%;top:89.67%;--pop-delay:1.9s;" data-href="https://mnyfces.com" data-external="true" data-label="mnyfces.com">
        <div class="dot"></div>
        <div class="dot-label">mnyfces.com</div>
      </div>

      <!-- 3. Pro Projects → projects.html -->
      <div class="dot-wrap" style="left:29.64%;top:40.17%;--pop-delay:2.1s;" data-href="projects.html" data-label="Professional Projects">
        <div class="dot"></div>
        <div class="dot-label">Professional Projects</div>
      </div>

      <!-- 4. What I'm Listening To → Spotify -->
      <div class="dot-wrap" style="left:64.18%;top:35.69%;--pop-delay:2.3s;" data-type="spotify" data-label="What I'm Listening To">
        <div class="dot"></div>
        <div class="dot-label">What I'm Listening To</div>
      </div>

      <!-- 5. Creative Projects → creativeprojects.html -->
      <div class="dot-wrap" id="creative" style="left:31.74%;top:44.83%;--pop-delay:2.5s;" data-href="creativeprojects.html" data-label="Creative Projects">
        <div class="dot"></div>
        <div class="dot-label">Creative Projects</div>
      </div>

      <!-- 6. Switch → day/night toggle -->
      <div class="dot-wrap" style="left:6.04%;top:63.67%;--pop-delay:2.7s;" data-type="daynight" data-label="Day / Night">
        <div class="dot"></div>
        <div class="dot-label" id="daynight-label">Switch to Day</div>
      </div>

    </div>
  </section>

  <div id="spotify-panel">
    <div class="sp-close" id="sp-close">×</div>
    <div id="sp-content"></div>
  </div>

  <script src="main.js" defer></script>
  <script>
    // Corner tag — live date & time
    function updateCornerTag() {
      const now = new Date();
      const dateEl = document.getElementById('ct-date');
      const timeEl = document.getElementById('ct-time-live');
      if (dateEl) {
        const d = now.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
        dateEl.textContent = 'Date: ' + d;
      }
      if (timeEl) {
        const t = now.toLocaleTimeString('en-US', {
          timeZone: 'America/Chicago',
          hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
        });
        timeEl.textContent = 'Time: ' + t;
      }
    }
    updateCornerTag();
    setInterval(updateCornerTag, 1000);
  </script>
</body>
</html>
