<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/">
  <title>Work</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    @font-face {
      font-family: 'Artific Trial';
      src: url('fonts/artific-regular.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Artific Trial';
      src: url('fonts/artific-black.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Advercase Demo';
      src: url('fonts/advercase-regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --color-bg: #f3f2f2;
      --color-surface: #eae9e9;
      --color-text: #201e1d;
      --color-accent: #000;
      --header-h: 64px;
    }

    html, body {
      height: 100%;
      background: var(--color-bg);
      color: var(--color-text);
      overflow: hidden;
      font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { background: none; border: none; color: inherit; font: inherit; cursor: pointer; }
    a { color: var(--color-accent); text-decoration: none; }
    a:hover { opacity: 0.75; }

    .mono {
      font: 400 9px/1 ui-monospace, Menlo, monospace;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .muted { color: color-mix(in srgb, var(--color-text) 50%, transparent); }

    /* ════════════════════════════════════
       HEADER
    ════════════════════════════════════ */
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--header-h);
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 0 clamp(18px, 3vw, 40px);
      background: var(--color-bg);
      z-index: 30;
    }
    .header-title {
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.01em;
      color: inherit;
      text-decoration: none;
    }
    .header-nav {
      margin-left: auto;
      display: flex;
      gap: 24px;
      align-items: center;
    }
    .header-nav .is-current { text-decoration: underline; text-underline-offset: 5px; }

    /* ════════════════════════════════════
       RAIL
    ════════════════════════════════════ */
    .rail {
      position: fixed;
      left: clamp(18px, 3vw, 40px);
      top: var(--header-h);
      bottom: 0;
      width: 46px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      z-index: 20;
    }
    .rail-track { position: relative; display: flex; flex-direction: column; gap: 22px; padding-left: 16px; }
    .rail-marker {
      position: absolute; left: 0; top: 0;
      width: 2px; height: 14px;
      background: var(--color-accent);
      transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.3s;
    }
    .rail-btn {
      height: 14px; display: flex; align-items: center;
      color: color-mix(in srgb, var(--color-text) 45%, transparent);
      transition: color 0.25s;
    }
    .rail-btn:hover, .rail-btn.active { color: var(--accent, var(--color-accent)); }

    /* ════════════════════════════════════
       GALLERY
    ════════════════════════════════════ */
    .sc {
      position: absolute;
      inset: var(--header-h) 0 0 0;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scrollbar-width: auto;
      scrollbar-color: color-mix(in srgb, var(--color-text) 55%, transparent) var(--color-surface);
    }
    .sc::-webkit-scrollbar { width: 10px; }
    .sc::-webkit-scrollbar-track { background: var(--color-surface); margin: 37.5% 0; }
    .sc::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--color-text) 55%, transparent); border-radius: 5px; }
    .sc::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--color-text) 75%, transparent); }

    .pj-slab {
      height: 100%;
      scroll-snap-align: start;
      display: grid;
      grid-template-columns: clamp(70px, 8vw, 110px) 1fr 1fr;
      box-sizing: border-box;
      cursor: pointer;
    }
    .pj-slab.no-case { cursor: default; }
    .pj-text {
      padding: clamp(28px, 5vh, 58px) clamp(24px, 3vw, 44px) clamp(24px, 4vh, 40px) 0;
      display: flex;
      flex-direction: column;
    }
    .pj-eyebrow { color: var(--accent, var(--color-accent)); }
    .pj-text h2 {
      margin: 20px 0 0;
      font-family: 'Case Text', 'Archivo', sans-serif;
      font-weight: 700;
      font-size: clamp(34px, 3.4vw, 52px);
      line-height: 0.98;
      letter-spacing: -0.025em;
      max-width: 11ch;
    }
    .pj-text p {
      margin: 22px 0 0;
      font-size: 15px;
      line-height: 1.62;
      max-width: 48ch;
      color: color-mix(in srgb, var(--color-text) 80%, transparent);
      text-wrap: pretty;
    }
    .pj-open-cue {
      margin-top: 18px;
      color: var(--accent, var(--color-accent));
      opacity: 0;
      transform: translateX(-6px);
      transition: opacity 0.25s, transform 0.25s;
    }
    .pj-slab:hover .pj-open-cue { opacity: 1; transform: translateX(0); }

    .pj-meta {
      margin-top: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding-top: 16px;
    }
    .pj-meta-item { padding: 16px 0; }
    .pj-meta-item + .pj-meta-item { padding-left: 8px; }
    .pj-meta-val { font-size: 14px; margin-top: 6px; }

    .pj-footer {
      margin-top: auto;
      padding-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
    }

    .pj-media {
      background: var(--color-bg);
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pj-media img {
      position: absolute;
      left: 50%;
      max-width: 55%;
      max-height: 200px;
      object-fit: contain;
      transform: translate(-50%, -50%);
    }

    @media (max-width: 820px) {
      .rail { display: none !important; }
      .pj-slab { grid-template-columns: 1fr !important; grid-template-rows: 38% 1fr !important; }
      .pj-slab .pj-media { order: -1; }
      .pj-slab .pj-media img { position: static !important; transform: none !important; max-height: 70%; }
      .pj-slab .pj-text { padding: 24px 18px 22px !important; }
      .pj-slab h2 { font-size: 32px !important; max-width: none !important; }
      .pj-slab p { font-size: 14px !important; max-width: none !important; }
      .pj-meta { grid-template-columns: 1fr 1fr !important; }
      .header-nav { display: none !important; }
    }

    /* ════════════════════════════════════
       CASE OVERLAY
    ════════════════════════════════════ */
    .case {
      position: fixed;
      inset: 0;
      background: var(--color-bg);
      z-index: 5000;
      transform: translateY(100%);
      transition: transform 0.7s cubic-bezier(0.76, 0, 0.24, 1);
      visibility: hidden;
    }
    .case.open { transform: translateY(0); visibility: visible; }

    .case-scroll {
      height: 100%;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: auto;
      scrollbar-color: color-mix(in srgb, var(--color-text) 55%, transparent) var(--color-surface);
    }
    .case-scroll::-webkit-scrollbar { width: 10px; }
    .case-scroll::-webkit-scrollbar-track { background: var(--color-surface); margin: 37.5% 0; }
    .case-scroll::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--color-text) 55%, transparent); border-radius: 5px; }
    .case-scroll::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--color-text) 75%, transparent); }

    .case-close {
      position: fixed;
      top: 22px; right: 22px;
      width: 42px; height: 42px;
      border-radius: 50%;
      background: var(--color-surface);
      color: var(--color-text);
      font-size: 15px;
      z-index: 5100;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.25s, background 0.25s;
    }
    .case-close:hover { transform: rotate(90deg); background: color-mix(in srgb, var(--color-text) 12%, var(--color-surface)); }

    .case-stack { position: relative; }
    .case-hero {
      position: sticky;
      top: 0;
      z-index: 0;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 5vw 10vh;
      background: var(--color-surface);
      overflow: hidden;
    }
    .case-hero-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      z-index: 0;
    }
    .case-hero-fade {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.3) 45%, rgba(0,0,0,0) 75%);
      z-index: 1;
    }
    .case-eyebrow {
      position: relative;
      z-index: 2;
      color: var(--accent, var(--color-accent));
      margin-bottom: 18px;
    }
    .case-title {
      position: relative;
      z-index: 2;
      font-weight: 800;
      font-size: clamp(40px, 8vw, 110px);
      line-height: 0.94;
      letter-spacing: -0.02em;
      max-width: 16ch;
    }
    .case-hero.has-cover .case-eyebrow { color: #fff; }
    .case-hero.has-cover .case-title { color: #fff; }
    .case-hero.has-cover .case-scrollcue { color: rgba(255,255,255,0.6); }
    .case-scrollcue {
      position: absolute;
      bottom: 4vh; left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      color: color-mix(in srgb, var(--color-text) 45%, transparent);
      animation: cue 2s ease-in-out infinite;
    }
    @keyframes cue {
      0%, 100% { transform: translate(-50%, 0); opacity: 0.4; }
      50%      { transform: translate(-50%, 8px); opacity: 0.9; }
    }

    .case-summary {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      background: var(--accent, var(--color-accent));
      color: #fff;
      padding: 12vh 5vw;
      box-sizing: border-box;
    }
    .case-summary-inner {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.7fr 1fr;
      align-items: start;
      gap: 8vw;
    }
    .case-problem-label {
      font-weight: 800;
      text-transform: uppercase;
      font-size: clamp(20px, 2.4vw, 34px);
      letter-spacing: 0.01em;
      margin-bottom: 24px;
    }
    .case-summary-text { font-size: clamp(20px, 2.1vw, 27px); line-height: 1.6; }
    .case-summary-label { color: rgba(255,255,255,0.65); margin-bottom: 16px; }
    .case-role-tags {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .case-role-tags li {
      font-weight: 400;
      font-size: clamp(15px, 1.3vw, 18px);
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    @media (max-width: 820px) {
      .case-summary-inner { grid-template-columns: 1fr; gap: 40px; }
    }

    .case-body { max-width: 780px; margin: 0 auto; padding: 14vh 24px 6vh; }
    .case-desc { font-size: clamp(17px, 1.6vw, 20px); line-height: 1.75; color: color-mix(in srgb, var(--color-text) 82%, transparent); }
    .case-meta { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 10vh; }
    .case-meta-item { padding: 20px 0; }
    .case-meta-val { font-size: 16px; margin-top: 8px; }
    .case-media {
      margin-top: 8vh;
      height: 46vh;
      border-radius: 4px;
      background: var(--color-bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .case-media img {
      max-width: 50%;
      max-height: 45%;
      object-fit: contain;
    }
    .case-cta {
      display: inline-flex; align-items: center; gap: 10px;
      margin-top: 8vh;
      padding: 14px 26px;
      border-radius: 999px;
      background: var(--accent, var(--color-accent));
      color: var(--color-bg);
      font-size: 12px; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      transition: opacity 0.25s;
    }
    .case-cta:hover { opacity: 0.85; }

    .case-end { padding: 16vh 5vw 12vh; text-align: center; }
    .case-end button {
      font-weight: 800;
      font-size: clamp(30px, 4.4vw, 52px);
      color: color-mix(in srgb, var(--color-text) 40%, transparent);
      letter-spacing: -0.01em;
      transition: color 0.3s;
    }
    .case-end button:hover { color: var(--color-text); }

    @media (prefers-reduced-motion: reduce) {
      .case { transition-duration: 0.01s; }
      .case-scrollcue { animation: none; }
    }

    /* ════════════════════════════════════
       PLURALSIGHT CASE STUDY
    ════════════════════════════════════ */
    .case-hero.ps-cover .case-title { font-family: 'Artific Trial', 'Archivo', sans-serif; font-weight: 700; }
    .case-stack .ps-hero { position: relative; z-index: 1; }

    .ps-end {
      background: #302e2b;
      min-height: 360px;
      padding: 106px clamp(24px, 9vw, 140px) 105px;
      display: flex; flex-direction: column; align-items: center; gap: 32px;
      text-align: center;
    }
    .ps-end-h {
      font-family: 'Case Display', 'Advercase Demo', serif;
      font-weight: 700;
      font-size: clamp(40px, 3.6vw, 52px);
      line-height: normal;
      letter-spacing: -0.02em;
      color: #ff1575;
    }
    .ps-end-btn {
      padding: 14px 26px;
      border-radius: 999px;
      background: #ff1575;
      color: #fff;
      font-family: 'Case Text', 'Artific Trial', 'Archivo', sans-serif;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      transition: opacity 0.25s;
    }
    .ps-end-btn:hover { opacity: 0.85; }

    .ps-case { font-family: 'Artific Trial', 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif; color: #1a0510; }

    .ps-hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6vw;
      background: #f5e9ec;
      padding: clamp(50px, 9vh, 110px) clamp(24px, 9vw, 140px) clamp(40px, 7vh, 90px);
      min-height: 100vh;
      min-height: 100dvh;
    }
    .ps-hero-main { display: flex; flex-direction: column; gap: clamp(24px, 4vh, 45px); max-width: 865px; }
    .ps-eyebrow {
      color: #ff1575;
      font-family: 'Case Text', 'Artific Trial', sans-serif;
      font-size: clamp(18px, 2.1vw, 29px);
      letter-spacing: 0.11em;
      font-weight: 500;
    }
    .ps-lede { font-size: clamp(22px, 3vw, 41px); line-height: 1.35; }
    .ps-provided { display: flex; flex-direction: column; gap: 24px; width: 173px; flex-shrink: 0; font-size: clamp(18px, 1.67vw, 24px); }
    .ps-provided-label { color: #ff1575; font-family: 'Case Text', 'Artific Trial', sans-serif; font-weight: 500; }
    .ps-provided-list { display: flex; flex-direction: column; gap: 24px; line-height: normal; }
    @media (max-width: 900px) {
      .ps-hero { flex-direction: column; align-items: flex-start; min-height: 0; }
      .ps-provided { width: 100%; }
    }

    .ps-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6vw;
      background: #fff;
      padding: clamp(50px, 9vh, 110px) clamp(24px, 9vw, 140px);
    }
    .ps-section.bg-pink { background: #f5e9ec; }
    .ps-section.reverse { flex-direction: row-reverse; }
    .ps-section-text { display: flex; flex-direction: column; gap: clamp(24px, 4vh, 50px); max-width: 568px; }
    .ps-heading {
      font-family: 'Advercase Demo', 'Archivo', sans-serif;
      color: #ff1575;
      font-size: clamp(30px, 5vw, 64px);
      line-height: 1.1;
      font-weight: 400;
    }
    .ps-body { font-size: clamp(16px, 1.6vw, 20px); line-height: 1.7; max-width: 455px; }
    .ps-section-media { flex-shrink: 0; width: 100%; max-width: 566px; }
    .ps-section-media img, .ps-section-media svg { display: block; width: 100%; height: auto; }
    @media (max-width: 900px) {
      .ps-section, .ps-section.reverse { flex-direction: column; }
      .ps-section-text { max-width: none; }
      .ps-body { max-width: none; }
    }

    .ps-section-center { flex-direction: column; text-align: center; }
    .ps-section-center .ps-section-text { max-width: 1160px; width: 100%; align-items: center; }
    .ps-section-center .ps-body { max-width: none; }
    .ps-section-center .ps-heading { max-width: none; white-space: nowrap; }
    @media (max-width: 1100px) {
      .ps-section-center .ps-heading { white-space: normal; }
    }

    .ps-body-long { display: flex; flex-direction: column; gap: 1.4em; }

    .ps-collab { align-items: flex-start; }
    .ps-collab-media {
      max-width: 520px;
      margin-top: clamp(24px, 17.7vw, 255px);
    }
    @media (max-width: 900px) {
      .ps-collab-media { margin-top: 0; }
    }

    .ps-art-520 { max-width: 520px; }
    .ps-art-560 { max-width: 560px; }
    .ps-art-600 { max-width: 600px; }
    .ps-section-center .ps-art-600 { margin-top: clamp(24px, 4vh, 50px); }
    .ps-narrow .ps-section-text { max-width: 728px; }
    .ps-narrow .ps-heading { white-space: normal; }
    .ps-bugs .ps-section-text { max-width: 612px; }
    .ps-bugs .ps-body { max-width: none; }

    /* ════════════════════════════════════
       SPOTTR CASE STUDY
    ════════════════════════════════════ */
    @font-face {
      font-family: 'Case Display';
      src: url('fonts/advercase-bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Case Text';
      src: url('fonts/artific-regular.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Case Text';
      src: url('fonts/artific-medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Case Text';
      src: url('fonts/artific-semibold.otf') format('opentype');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Case Text';
      src: url('fonts/artific-superbold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    .sp-case {
      --sp-red: #ff4632;
      --sp-dark: #302e2b;
      --sp-cream: #f5f1e8;
      --sp-card: #f7f4ed;
      --sp-rule: #dbd6cc;
      --sp-ink: #0f0f0f;
      --sp-gray: #6b6b6b;
      --sp-paper: #efede3;
      font-family: 'Case Text', 'Artific Trial', 'Archivo', sans-serif;
      font-weight: 400;
      color: var(--sp-ink);
    }
    :where(.sp-case) :where(p, h1, h2, h3) { margin: 0; font-weight: inherit; }
    .sp-case img { display: block; }
    .sp-semi { font-weight: 600; }
    .sp-case .sp-eyebrow, .sp-case .sp-provided-label, .sp-case .sp-label, .sp-table .sp-th,
    .sp-case .sp-pair-lbl, .sp-case .sp-loopstrip-l { font-weight: 500; }
    .sp-display { font-family: 'Case Display', 'Advercase Demo', serif; font-weight: 700; }

    .sp-sec {
      position: relative;
      background: #fff;
      padding: 110px clamp(24px, 9.72vw, 140px);
    }
    .sp-sec.sp-dark { background: var(--sp-dark); }
    .sp-sec.sp-cream { background: var(--sp-cream); }
    .sp-inner { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }
    .sp-label {
      position: absolute;
      left: 24px; top: 64px;
      color: var(--sp-red);
      font-size: 14px;
      letter-spacing: 0.12em;
      white-space: nowrap;
    }

    .sp-head { display: flex; flex-direction: column; gap: 16px; }
    .sp-head.sp-right { align-items: flex-end; text-align: right; }
    .sp-head.sp-center { align-items: center; text-align: center; }
    .sp-h2 { color: var(--sp-red); font-size: clamp(34px, 3.6vw, 52px); line-height: 1; }
    .sp-lede { font-size: clamp(17px, 1.4vw, 20px); line-height: 1.5; max-width: 640px; color: var(--sp-ink); }
    .sp-dark .sp-lede { color: var(--sp-paper); }
    .sp-copy { font-size: 16px; line-height: 1.55; color: var(--sp-gray); max-width: 780px; }

    /* 01 intro */
    .sp-intro { padding-top: 60px; display: flex; }
    .sp-stack-top { position: relative; z-index: 1; }

              <p class="ps-lede">I led a systematic UX and content audit across a complex internal authoring tool suite, completing four full audits and a beta QA pass on a fifth tool still in development. The goal was to evaluate these tools against the corporate design system, brand voice guidelines, and AI UX principles to determine if they could function as a cohesive "one-stop shop" for a sequential content workflow.</p>

              <p class="ps-body">The authoring suite consisted of four distinct tools, with a fifth still in beta, all built by a small, tight-knit team of creative technologists. Because the team was developing different tools in parallel, the suite had become visually and functionally inconsistent. On top of that, these tools marked the company's first in-house introduction of AI features, so there were no existing UI patterns or design system standards to govern these new interfaces. The challenge was to bring cohesion to the ecosystem without stifling the team's ongoing development.</p>

              <p class="ps-body">As the sole driver of this audit, I needed to establish a rigorous, objective baseline before evaluating. I developed a User Journey Framework detailing requirements for AI UX best practices, design system adherence, and ecosystem cohesion. I presented this to the team, and leadership formally adopted it as our operating standard. From there, I created a 22-criterion weighted audit scorecard, heavily prioritizing AI autonomy and cross-tool consistency to enable precise, side-by-side comparisons of the entire suite. To keep findings actionable, I organized them into a six-category taxonomy with a four-level priority system, so engineering and design could triage by impact instead of sorting through a flat list.</p>
            </div>
            <div class="ps-section-media ps-art-520"><img src="pluralsight/single-source-of-truth.svg" alt=""></div>
          </section>

          <section class="ps-section ps-collab">
            <div class="ps-section-text">
              <h2 class="ps-heading">Building context through collaboration</h2>
              <p class="ps-body">Building context quickly during a short internship initially felt like a roadblock, but I soon realized my unfamiliarity was my greatest asset. A fresh perspective allowed me to spot interface inconsistencies the team had naturally grown accustomed to. However, identifying the friction was only half the work. I needed to step outside my immediate team to understand the technical and strategic reasons behind it. I made relationship-building a priority, initiating outreach to senior designers to understand the corporate design system and partnering with colleagues to integrate accessibility research. By actively engaging with disciplines ranging from rotating engineers to the VP of Architecture, I ensured the work remained aligned with the organization's bigger picture.</p>
            </div>
            <div class="ps-section-media ps-collab-media"><img src="pluralsight/collaboration.jpg" alt=""></div>
          </section>

          <section class="ps-section bg-pink ps-section-center ps-narrow">
            <div class="ps-section-text">
                <h2 class="ps-heading">Designing for reality, not just aesthetics</h2>
                <p class="ps-body">Good UX has to actually be buildable. Working alongside a small team of creative technologists, I realized my job wasn't just to point out interface flaws, but to help connect the dots between their parallel projects. I took a solution-first approach by taking the time to learn the underlying technical architecture. For example, I set up the full-stack local environment for a new beta tool myself so I could run a hands-on QA audit. Because I understood how the tools were built under the hood, I could ensure every UX recommendation and AI pattern I proposed was actually feasible for the engineering team to execute.</p>
            </div>
          </section>

          <section class="ps-section reverse ps-bugs">
            <div class="ps-section-text">
              <h2 class="ps-heading">Looking past the bugs</h2>
              <p class="ps-body">Not every finding was a bug. While testing one tool’s AI-generated summaries, I noticed that AI-written content wasn’t held to the same editorial standards as the hand-written interface copy around it. I confirmed the gap existed in no current guideline or research doc and flagged it as a policy issue rather than a QA ticket. The audit also exposed a process problem: content reviews were scattered across chat threads and spreadsheets. I pitched a unified production tracker that would follow each piece of content through the pipeline by reference number and notify the right person when action was needed. The concept gained enough traction that a designer picked it up and carried it forward.</p>
            </div>
            <div class="ps-section-media ps-art-560"><img src="pluralsight/looking-past-the-bugs.svg" alt=""></div>

          <section class="ps-section bg-pink ps-section-center">

                <p>By the end of the audit, I had logged over 130 findings across five tools and mapped out entirely new AI UX patterns to guide future development. However, I knew that raw data is only valuable if it actually drives action.</p>
                <p>Halfway through the project, a major organizational shift occurred when the Product and Content orgs merged. Their new shared goal was driving internal tool adoption. This was a pivotal moment for me. I realized that to make my work truly matter, I had to stop framing UX purely as a usability exercise and start pitching it as a core business strategy. I completely reframed my final documentation to show how resolving these specific interface inconsistencies would directly move the needle on their new adoption metrics, and proposed specific KPIs for measuring UX’s contribution to that goal.</p>
                <p>Looking back, the most rewarding part of this project was its permanence. My strategic roadmap did not just sit in a folder when my internship ended. It became the operational foundation for the team, directly resulting in the launch of a recurring bi-weekly UX sprint to tackle the issues I identified. The experience taught me that successful design is not just about delivering a polished artifact. It is about equipping a team with the clarity and direction they need to keep building long after you step away.</p>

          <section class="sp-sec sp-dark sp-loop" style="padding-bottom:129px">
            <p class="sp-label">05 · THE CORE LOOP</p>
            <div class="sp-inner">
              <div class="sp-head">
                <h2 class="sp-h2 sp-display">One push day, start to finish</h2>
                <p class="sp-lede">Legs are still sore from the weekend and there are 15 minutes to train. Here’s how Spottr gets from “how recovered am I?” to a saved session.</p>
              </div>
              ${step(1, 'loop-1.png', 'Home shows what’s ready', 'A readiness ring reads 78 with “Good day for upper body,” and right under it, “Legs need about 18 more hours.” The muscle map tints quads and hamstrings as still recovering. HRV, resting heart rate, and sleep sit below to explain the score.', 'a body map instead of a list of muscle percentages. People read a body faster than a table, and a Needs rest, Recovering, Ready legend means color is never the only cue.', false)}
              ${step(2, 'loop-2.png', 'Setup suggests, it doesn’t force', 'Time, focus, and equipment are three chip rows, so the questions that stall people at the gym door get answered in three taps. “Upper body · suggested” is pre-selected from recovery data, and the plan updates live: 2 exercises, about 15 minutes.', 'pre-select, never lock. Push, Pull, Core, and Full body stay one tap away. The app advises; the lifter decides.', true)}
              ${step(3, 'loop-3.png', 'The working set', 'Dumbbell Bench Press, set 1 of 3, 6 to 8 reps at 135 lbs. Reps and weight get big readouts with plus and minus buttons, and one Log set button sits at the bottom. Set dots track progress.', 'one exercise fills the screen with 44pt targets, built for sweaty hands and quick glances between sets.', false)}
              ${step(4, 'loop-4.png', 'The loop closes', 'After a timed finisher, the summary shows volume, duration, and the muscles trained on a two-tone map. Back on Home, the message changes to “Great push day. Rest up tonight.”', 'the session only saves at the end. An early flow wrote every set live, which left half-saved workouts behind when someone cancelled. Holding the session until “Complete” made cancelling clean.', true)}
              <div class="sp-loopstrip">

    function untCaseHTML(p) {
      const stat = (n, b) => `
        <div class="ut-stat">
          <p class="ut-stat-n ut-display">${n}</p>
          <p class="ut-stat-b">${b}</p>
        </div>`;
      const quote = (q, who) => `
        <div class="ut-quote">
          <p class="ut-quote-q">${q}</p>
          <p class="ut-quote-who">${who}</p>
        </div>`;
      const point = (n, t, b) => `
        <div class="ut-point">
          <p class="ut-point-n ut-display">${n}</p>
          <p class="ut-point-t">${t}</p>
          <p class="ut-point-b">${b}</p>
        </div>`;
      return `
        <div class="case-stack">
          <section class="case-hero has-cover ps-cover">
            <div class="case-hero-bg" style="background-image:url('${encodeURI(p.cover)}')"></div>
            <div class="case-hero-fade"></div>
            <div class="mono case-eyebrow">${p.eyebrow}</div>
            <h1 class="case-title">${p.title}</h1>
            <div class="mono case-scrollcue">Scroll ↓</div>
          </section>
        <div class="ut-case ut-stack-top">
          <section class="ut-sec ut-intro">
            <div class="ut-inner">
              <div class="ut-intro-main">
                <p class="ut-eyebrow">UNIVERSITY OF NORTH TEXAS</p>
                <p class="ut-intro-lede">A mixed-methods UX study of how adults aged 60 and over use everyday technology. Ten participants aged 61 to 85 worked through six everyday tasks on their own devices, bracketed by pre- and post-task interviews. Their recurring barriers became seven design strategies for reducing cognitive load.</p>
              </div>
              <div class="ut-provided">
                <p class="ut-provided-label">I provided</p>
                <div class="ut-provided-list">
                  <p>UX RESEARCH</p>
                  <p>USABILITY TESTING</p>
                  <p>ACCESSIBILITY</p>
                  <p>DESIGN STRATEGY</p>
                </div>
              </div>
            </div>
          </section>
        </div>
        </div>
        <div class="ut-case">

          <section class="ut-sec ut-fails">
            <div class="ut-inner">
              <div class="ut-col">
                <h2 class="ut-h2 ut-display">Where everyday tech fails older adults</h2>
                <p class="ut-body">Ten adults aged 61 to 85 worked through six everyday tasks on their own devices while I timed each one and logged every error. Every task was completed, but the cost shows in the spread. Three patterns ran underneath all of it: touch targets too small to hit reliably, cluttered layouts and pop-ups that buried the primary action, and ambiguous icons sitting behind deeply nested menus.</p>
              </div>
              <div class="ut-art ut-art-fails"><img src="unt/older-adult-at-home.svg" alt=""></div>
            </div>
          </section>

          <section class="ut-sec ut-numbers">
            <div class="ut-inner">
              <h2 class="ut-numbers-h ut-display">What the sessions measured</h2>
              <div class="ut-stats">
                ${stat('146s', 'average to find a library’s opening hours, ranging from 45 to 360')}
                ${stat('114s', 'average to send a message, with autocorrect and wrong-field errors')}
                ${stat('35s', 'average to open the Calendar app, the fastest task of the six')}
                ${stat('80<span class="ut-pct">%</span>', 'success rate on the recipe search, derailed by ads and auto-play video')}
                ${stat('3 of 10', 'had ever used a built-in accessibility feature before the session')}
                ${stat('60<span class="ut-pct">%</span>', 'attempted the optional accessibility task at all')}
              </div>
              <div class="ut-quotes">
                ${quote('“ended up clicking the wrong thing because the buttons are tiny”', 'P01, 61')}
                ${quote('“Why do they hide the simple stuff?”', 'P09, 81')}
                ${quote('“I would have given up at home”', 'P03, 68')}
              </div>
            </div>
          </section>

          <section class="ut-sec ut-strats">
            <div class="ut-inner">
              <div class="ut-strats-top">
                <div class="ut-art"><img src="unt/designing-for-access.svg" alt=""></div>
                <div class="ut-col">
                  <h2 class="ut-h2 ut-display">Seven strategies teams can build on</h2>
                  <p class="ut-body">The findings translated into seven implementable strategies, each mapped to a specific observed failure. Together they give product teams a concrete starting point for accessible design, not just a critique.</p>
                </div>
              </div>
              <div class="ut-strat-grid">
                ${point('01', 'Prioritise clarity and simplicity', 'Minimise visual clutter, use high contrast, and rely on large, clearly labelled buttons. Progressive disclosure shows the essentials first.')}
                ${point('02', 'Optimise navigation structures', 'Shallow hierarchies and consistent control placement help older users build reliable mental models. Critical functions never hide behind ambiguous icons.')}
                ${point('03', 'Support multimodal input', 'Voice commands, search bars, and hardware shortcuts spread effort across modalities. They stay optional and arrive with brief guidance.')}
                ${point('04', 'Enhance discoverability of accessibility features', 'Short prompts introduce magnifiers, high-contrast modes, and screen readers. One-step activation, plain-language descriptions, easy to switch off.')}
                ${point('05', 'Reduce external distractions', 'Limit advertisements, avoid auto-play media, and keep pop-ups off core content. Ads that must appear sit somewhere that needs no precise tap.')}
                ${point('06', 'Foster trust and safety', 'Signal secure connections, explain permission requests plainly, and teach users to spot scams. No dark patterns that echo a fraudster’s tactics.')}
                ${point('07', 'Co-design with older adults', 'Workshops and iterative testing surface barriers that heuristic evaluation misses, and validate the solutions before they ship.')}
              </div>
            </div>
          </section>

          <section class="ut-sec ut-method">
            <div class="ut-inner">
              <div>
                <h2 class="ut-h2 ut-display">How the study was run</h2>
                <p class="ut-body">The study was built to watch real behavior, not collect opinions. Sessions ran 45 to 60 minutes, in participants’ homes, in community settings, or over Zoom, and each was planned and moderated end to end, from recruiting through synthesis.</p>
                <ul class="ut-list">
                  <li>10 adults aged 61 to 85, mean age 69, six women and four men, recruited across North Texas</li>
                  <li>Informed consent before every session; video recorded only with the participant’s permission</li>
                  <li>Six everyday tasks: find a library’s hours, adjust a device setting, send a message, open the Calendar app, search for a recipe, try an accessibility feature</li>
                  <li>Their own devices wherever possible, with a simplified loaner on hand</li>
                  <li>Completion status, time on task, and error type logged, not just opinions</li>
                  <li>Pre- and post-task interviews coded with Braun and Clarke reflexive thematic analysis</li>
                </ul>
              </div>
              <div class="ut-art"><img src="unt/moderated-session.svg" alt=""></div>
            </div>
          </section>

          <section class="ut-sec ut-synth">
            <div class="ut-inner">
              <div class="ut-art"><img src="unt/moving-forward.svg" alt=""></div>
              <div class="ut-col">
                <h2 class="ut-h2 ut-display">Turning observation into direction</h2>
                <p class="ut-body">Raw session notes are not insight on their own. Task times, success rates, and error counts were summarized with descriptive statistics, then interview transcripts and field notes were coded and refined into six themes using Braun and Clarke’s reflexive thematic analysis, with representative quotations anchoring each one. What came out is a short, defensible set of priorities a team can act on, not a list of complaints.</p>
              </div>
            </div>
          </section>

          <section class="ut-sec ut-work">
            <div class="ut-inner">
              <h2 class="ut-h2 ut-display">What the work involved</h2>
              <div class="ut-points">
                ${point('01', 'Real users, real tasks', 'Sessions were run with ten older adults on real tasks, not proxies or assumptions.')}
                ${point('02', 'Designed for range', 'Participants ranged from daily online bankers to two who used basic flip phones, so the barriers span vision, dexterity, and working memory.')}
                ${point('03', 'Signal from noise', 'Recurring friction was coded across ten sessions and refined into six themes, each tied to a design response.')}
                ${point('04', 'Made to be used', 'Findings were handed over as recommendations a product team could build from.')}
              </div>
            </div>
          </section>

          <section class="ut-sec ut-end">
            <div class="ut-end-inner">
              <h2 class="ut-end-h ut-display">Go deeper</h2>
              <p class="ut-end-b">The full thesis covers the method, every finding, and the research behind the recommendations.</p>
              <div class="ut-btns">
                <a class="ut-btn ut-btn-fill" href="${p.cta.href}" target="_blank" rel="noopener">Read the full thesis</a>
                <a class="ut-btn ut-btn-line" href="${p.cta.href}" download>Download PDF</a>
              </div>
              <p class="ut-sign">Sean Mapuke · Bridging the Digital Divide · December 2025</p>
            </div>
          </section>
        </div>`;
    }

    function startLenis() {
      if (typeof Lenis === 'undefined' || reducedMotion) return;
      lenis = new Lenis({ wrapper: caseScroll, content: caseContent, duration: 1.25, smoothWheel: true });
      const raf = (t) => { if (!lenis) return; lenis.raf(t); rafId = requestAnimationFrame(raf); };
      rafId = requestAnimationFrame(raf);
    }
    function stopLenis() {
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      if (lenis) { lenis.destroy(); lenis = null; }
    }

    function openCase(i, pushHash = true) {
      const p = projects[i];
      if (!p.hasCase) return;
      caseEl.style.setProperty('--accent', p.accent || '');
      caseContent.innerHTML = p.id === 'pluralsight' ? pluralsightCaseHTML(p)
        : p.id === 'spottr' ? spottrCaseHTML(p)
        : p.id === 'digital-divide' ? untCaseHTML(p)
        : caseHTML(p);
      caseScroll.scrollTop = 0;
      caseEl.classList.add('open');
      caseOpen = true;
      startLenis();
      if (pushHash) {
        history.pushState({ project: p.id }, '', '/work/' + p.id);
        pushedCase = true;
      }
      document.title = p.title;
    }

    function closeCase(viaHistory = false) {
      if (!caseOpen) return;
      caseEl.classList.remove('open');
      caseOpen = false;
      stopLenis();
      document.title = 'Work';
      // A case opened by direct link has no history entry behind it, so back() would leave the site.
      if (!viaHistory) {
        if (pushedCase) history.back();
        else history.replaceState(null, '', '/work');
      }
      pushedCase = false;
    }

    document.getElementById('case-close').addEventListener('click', () => closeCase());
    document.addEventListener('keydown', e => { if (caseOpen && e.key === 'Escape') closeCase(); });

    function caseIdFromUrl() {
      const m = location.pathname.match(/^\/work\/([^/]+)\/?$/);
      return m ? decodeURIComponent(m[1]) : location.hash.slice(1);
    }

    window.addEventListener('popstate', () => {
      const idx = projects.findIndex(p => p.id === caseIdFromUrl());
      if (idx >= 0) openCase(idx, false);
      else closeCase(true);
    });

    const initialId = caseIdFromUrl();
    const initialIdx = projects.findIndex(p => p.id === initialId);
    if (initialIdx >= 0) {
      openCase(initialIdx, false);
      if (location.hash) history.replaceState(null, '', '/work/' + initialId);
    } else if (location.pathname !== '/work') {
      history.replaceState(null, '', '/work');
    }
  </script>
