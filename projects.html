<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    @font-face {
      font-family: 'Artific Trial';
      src: url('ArtificTrial-Regular.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Artific Trial';
      src: url('ArtificTrial-Black.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Advercase Demo';
      src: url('Advercase-Font-Demo-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --color-bg: #f3f2f2;
      --color-surface: #eae9e9;
      --color-text: #201e1d;
      --color-accent: #000;
      --header-h: 64px;
    }

    html, body {
      height: 100%;
      background: var(--color-bg);
      color: var(--color-text);
      overflow: hidden;
      font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { background: none; border: none; color: inherit; font: inherit; cursor: pointer; }
    a { color: var(--color-accent); text-decoration: none; }
    a:hover { opacity: 0.75; }

    .mono {
      font: 400 9px/1 ui-monospace, Menlo, monospace;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .muted { color: color-mix(in srgb, var(--color-text) 50%, transparent); }

    /* ════════════════════════════════════
       HEADER
    ════════════════════════════════════ */
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--header-h);
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 0 clamp(18px, 3vw, 40px);
      background: var(--color-bg);
      z-index: 30;
    }
    .header-title {
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.01em;
      color: inherit;
      text-decoration: none;
    }
    .header-nav {
      margin-left: auto;
      display: flex;
      gap: 24px;
      align-items: center;
    }

    /* ════════════════════════════════════
       RAIL
    ════════════════════════════════════ */
    .rail {
      position: fixed;
      left: clamp(18px, 3vw, 40px);
      top: var(--header-h);
      bottom: 0;
      width: 46px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      z-index: 20;
    }
    .rail-track { position: relative; display: flex; flex-direction: column; gap: 22px; padding-left: 16px; }
    .rail-marker {
      position: absolute; left: 0; top: 0;
      width: 2px; height: 14px;
      background: var(--color-accent);
      transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.3s;
    }
    .rail-btn {
      height: 14px; display: flex; align-items: center;
      color: color-mix(in srgb, var(--color-text) 45%, transparent);
      transition: color 0.25s;
    }
    .rail-btn:hover, .rail-btn.active { color: var(--accent, var(--color-accent)); }

    /* ════════════════════════════════════
       GALLERY
    ════════════════════════════════════ */
    .sc {
      position: absolute;
      inset: var(--header-h) 0 0 0;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scrollbar-width: auto;
      scrollbar-color: color-mix(in srgb, var(--color-text) 55%, transparent) var(--color-surface);
    }
    .sc::-webkit-scrollbar { width: 10px; }
    .sc::-webkit-scrollbar-track { background: var(--color-surface); margin: 37.5% 0; }
    .sc::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--color-text) 55%, transparent); border-radius: 5px; }
    .sc::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--color-text) 75%, transparent); }

    .pj-slab {
      height: 100%;
      scroll-snap-align: start;
      display: grid;
      grid-template-columns: clamp(70px, 8vw, 110px) 1fr 1fr;
      box-sizing: border-box;
      cursor: pointer;
    }
    .pj-slab.no-case { cursor: default; }
    .pj-text {
      padding: clamp(28px, 5vh, 58px) clamp(24px, 3vw, 44px) clamp(24px, 4vh, 40px) 0;
      display: flex;
      flex-direction: column;
    }
    .pj-eyebrow { color: var(--accent, var(--color-accent)); }
    .pj-text h2 {
      margin: 20px 0 0;
      font-family: 'Artific Trial', 'Archivo', sans-serif;
      font-weight: 700;
      font-size: clamp(34px, 3.4vw, 52px);
      line-height: 0.98;
      letter-spacing: -0.025em;
      max-width: 11ch;
    }
    .pj-text p {
      margin: 22px 0 0;
      font-size: 15px;
      line-height: 1.62;
      max-width: 48ch;
      color: color-mix(in srgb, var(--color-text) 80%, transparent);
      text-wrap: pretty;
    }
    .pj-open-cue {
      margin-top: 18px;
      color: var(--accent, var(--color-accent));
      opacity: 0;
      transform: translateX(-6px);
      transition: opacity 0.25s, transform 0.25s;
    }
    .pj-slab:hover .pj-open-cue { opacity: 1; transform: translateX(0); }

    .pj-meta {
      margin-top: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding-top: 16px;
    }
    .pj-meta-item { padding: 16px 0; }
    .pj-meta-item + .pj-meta-item { padding-left: 8px; }
    .pj-meta-val { font-size: 14px; margin-top: 6px; }

    .pj-footer {
      margin-top: auto;
      padding-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
    }

    .pj-media {
      background: var(--color-bg);
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pj-media img {
      position: absolute;
      left: 50%;
      max-width: 55%;
      max-height: 200px;
      object-fit: contain;
      transform: translate(-50%, -50%);
    }

    @media (max-width: 820px) {
      .rail { display: none !important; }
      .pj-slab { grid-template-columns: 1fr !important; grid-template-rows: 38% 1fr !important; }
      .pj-slab .pj-media { order: -1; }
      .pj-slab .pj-media img { position: static !important; transform: none !important; max-height: 70%; }
      .pj-slab .pj-text { padding: 24px 18px 22px !important; }
      .pj-slab h2 { font-size: 32px !important; max-width: none !important; }
      .pj-slab p { font-size: 14px !important; max-width: none !important; }
      .pj-meta { grid-template-columns: 1fr 1fr !important; }
      .header-nav { display: none !important; }
    }

    /* ════════════════════════════════════
       CASE OVERLAY
    ════════════════════════════════════ */
    .case {
      position: fixed;
      inset: 0;
      background: var(--color-bg);
      z-index: 5000;
      transform: translateY(100%);
      transition: transform 0.7s cubic-bezier(0.76, 0, 0.24, 1);
      visibility: hidden;
    }
    .case.open { transform: translateY(0); visibility: visible; }

    .case-scroll {
      height: 100%;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: auto;
      scrollbar-color: color-mix(in srgb, var(--color-text) 55%, transparent) var(--color-surface);
    }
    .case-scroll::-webkit-scrollbar { width: 10px; }
    .case-scroll::-webkit-scrollbar-track { background: var(--color-surface); margin: 37.5% 0; }
    .case-scroll::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--color-text) 55%, transparent); border-radius: 5px; }
    .case-scroll::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--color-text) 75%, transparent); }

    .case-close {
      position: fixed;
      top: 22px; right: 22px;
      width: 42px; height: 42px;
      border-radius: 50%;
      background: var(--color-surface);
      color: var(--color-text);
      font-size: 15px;
      z-index: 5100;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.25s, background 0.25s;
    }
    .case-close:hover { transform: rotate(90deg); background: color-mix(in srgb, var(--color-text) 12%, var(--color-surface)); }

    .case-stack { position: relative; }
    .case-hero {
      position: sticky;
      top: 0;
      z-index: 0;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 5vw 10vh;
      background: var(--color-surface);
      overflow: hidden;
    }
    .case-hero-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      z-index: 0;
    }
    .case-hero-fade {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.3) 45%, rgba(0,0,0,0) 75%);
      z-index: 1;
    }
    .case-eyebrow {
      position: relative;
      z-index: 2;
      color: var(--accent, var(--color-accent));
      margin-bottom: 18px;
    }
    .case-title {
      position: relative;
      z-index: 2;
      font-weight: 800;
      font-size: clamp(40px, 8vw, 110px);
      line-height: 0.94;
      letter-spacing: -0.02em;
      max-width: 16ch;
    }
    .case-hero.has-cover .case-eyebrow { color: #fff; }
    .case-hero.has-cover .case-title { color: #fff; }
    .case-hero.has-cover .case-scrollcue { color: rgba(255,255,255,0.6); }
    .case-scrollcue {
      position: absolute;
      bottom: 4vh; left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      color: color-mix(in srgb, var(--color-text) 45%, transparent);
      animation: cue 2s ease-in-out infinite;
    }
    @keyframes cue {
      0%, 100% { transform: translate(-50%, 0); opacity: 0.4; }
      50%      { transform: translate(-50%, 8px); opacity: 0.9; }
    }

    .case-summary {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      background: var(--accent, var(--color-accent));
      color: #fff;
      padding: 12vh 5vw;
      box-sizing: border-box;
    }
    .case-summary-inner {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.7fr 1fr;
      align-items: start;
      gap: 8vw;
    }
    .case-problem-label {
      font-weight: 800;
      text-transform: uppercase;
      font-size: clamp(20px, 2.4vw, 34px);
      letter-spacing: 0.01em;
      margin-bottom: 24px;
    }
    .case-summary-text { font-size: clamp(20px, 2.1vw, 27px); line-height: 1.6; }
    .case-summary-label { color: rgba(255,255,255,0.65); margin-bottom: 16px; }
    .case-role-tags {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .case-role-tags li {
      font-weight: 400;
      font-size: clamp(15px, 1.3vw, 18px);
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    @media (max-width: 820px) {
      .case-summary-inner { grid-template-columns: 1fr; gap: 40px; }
    }

    .case-body { max-width: 780px; margin: 0 auto; padding: 14vh 24px 6vh; }
    .case-desc { font-size: clamp(17px, 1.6vw, 20px); line-height: 1.75; color: color-mix(in srgb, var(--color-text) 82%, transparent); }
    .case-meta { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 10vh; }
    .case-meta-item { padding: 20px 0; }
    .case-meta-val { font-size: 16px; margin-top: 8px; }
    .case-media {
      margin-top: 8vh;
      height: 46vh;
      border-radius: 4px;
      background: var(--color-bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .case-media img {
      max-width: 50%;
      max-height: 45%;
      object-fit: contain;
    }
    .case-cta {
      display: inline-flex; align-items: center; gap: 10px;
      margin-top: 8vh;
      padding: 14px 26px;
      border-radius: 999px;
      background: var(--accent, var(--color-accent));
      color: var(--color-bg);
      font-size: 12px; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      transition: opacity 0.25s;
    }
    .case-cta:hover { opacity: 0.85; }

    .case-end { padding: 16vh 5vw 12vh; text-align: center; }
    .case-end button {
      font-weight: 800;
      font-size: clamp(30px, 4.4vw, 52px);
      color: color-mix(in srgb, var(--color-text) 40%, transparent);
      letter-spacing: -0.01em;
      transition: color 0.3s;
    }
    .case-end button:hover { color: var(--color-text); }

    @media (prefers-reduced-motion: reduce) {
      .case { transition-duration: 0.01s; }
      .case-scrollcue { animation: none; }
    }

    /* ════════════════════════════════════
       PLURALSIGHT CASE STUDY
    ════════════════════════════════════ */
    .case-hero.ps-cover .case-title { font-family: 'Artific Trial', 'Archivo', sans-serif; font-weight: 700; }
    .case-stack .ps-hero { position: relative; z-index: 1; }

    .ps-case-end { background: #fff; }
    .ps-case-end button { font-family: 'Artific Trial', 'Archivo', sans-serif; font-weight: 700; }

    .ps-case { font-family: 'Artific Trial', 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif; color: #1a0510; }

    .ps-hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6vw;
      background: #f5e9ec;
      padding: clamp(50px, 9vh, 110px) clamp(24px, 9vw, 140px) clamp(40px, 7vh, 90px);
      min-height: 100vh;
      min-height: 100dvh;
    }
    .ps-hero-main { display: flex; flex-direction: column; gap: clamp(24px, 4vh, 45px); max-width: 865px; }
    .ps-eyebrow {
      color: #ff1575;
      font-size: clamp(18px, 2.1vw, 29px);
      letter-spacing: 0.11em;
      font-weight: 400;
    }
    .ps-lede { font-size: clamp(22px, 3vw, 41px); line-height: 1.35; }
    .ps-provided { display: flex; flex-direction: column; gap: 10px; width: 173px; flex-shrink: 0; }
    .ps-provided-label { color: #ff1575; font-size: 16px; letter-spacing: 0.02em; }
    .ps-provided-list { display: flex; flex-direction: column; gap: 16px; font-size: 17.8px; line-height: 1.3; }
    @media (max-width: 900px) {
      .ps-hero { flex-direction: column; align-items: flex-start; min-height: 0; }
      .ps-provided { width: 100%; }
    }

    .ps-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6vw;
      background: #fff;
      padding: clamp(50px, 9vh, 110px) clamp(24px, 9vw, 140px);
    }
    .ps-section.bg-pink { background: #f5e9ec; }
    .ps-section.reverse { flex-direction: row-reverse; }
    .ps-section-text { display: flex; flex-direction: column; gap: clamp(24px, 4vh, 50px); max-width: 568px; }
    .ps-heading {
      font-family: 'Advercase Demo', 'Archivo', sans-serif;
      color: #ff1575;
      font-size: clamp(30px, 5vw, 64px);
      line-height: 1.1;
      font-weight: 400;
    }
    .ps-body { font-size: clamp(16px, 1.6vw, 20px); line-height: 1.7; max-width: 455px; }
    .ps-section-media { flex-shrink: 0; width: 100%; max-width: 566px; }
    .ps-section-media img, .ps-section-media svg { display: block; width: 100%; height: auto; }
    @media (max-width: 900px) {
      .ps-section, .ps-section.reverse { flex-direction: column; }
      .ps-section-text { max-width: none; }
      .ps-body { max-width: none; }
    }

    .ps-section-center { flex-direction: column; text-align: center; }
    .ps-section-center .ps-section-text { max-width: 1160px; width: 100%; align-items: center; }
    .ps-section-center .ps-body { max-width: none; }
    .ps-section-center .ps-heading { max-width: none; white-space: nowrap; }
    @media (max-width: 1100px) {
      .ps-section-center .ps-heading { white-space: normal; }
    }

    .ps-body-long { display: flex; flex-direction: column; gap: 1.4em; }

    .ps-collab { align-items: flex-start; }
    .ps-collab-media {
      max-width: 449px;
      margin-top: clamp(24px, 20vw, 361px);
    }
    @media (max-width: 900px) {
      .ps-collab-media { margin-top: 0; }
    }

    .ps-grid12 { display: grid; grid-template-columns: repeat(12, 1fr); column-gap: 24px; width: 100%; }
    .ps-col-mid8 { grid-column: 3 / span 8; display: flex; flex-direction: column; gap: clamp(24px, 4vh, 50px); text-align: left; }
    .ps-col-mid8 .ps-body, .ps-col-mid8 .ps-heading { max-width: none; }
    @media (max-width: 900px) {
      .ps-col-mid8 { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>

  <div class="header">
    <a class="header-title" href="index.html">Sean Mapuke</a>
    <div class="header-nav">
      <a class="mono" href="index.html">← Back to the room</a>
    </div>
  </div>

  <div class="rail" id="rail">
    <div class="rail-track" id="rail-track"></div>
  </div>

  <div class="sc" id="sc"></div>

  <div class="case" id="case">
    <button class="case-close" id="case-close" aria-label="Close project">✕</button>
    <div class="case-scroll" id="case-scroll">
      <div id="case-content"></div>
    </div>
  </div>

  <script>
    /* ── Project data ─────────────────────── */
    const projects = [
      {
        id: 'pluralsight',
        eyebrow: '01 / Pluralsight',
        title: 'Unifying Enterprise Content Creation',
        desc: 'Five internal authoring tools had each grown their own conventions. I audited all five against one combined UX and content-quality rubric, logged every inconsistency in a shared tracker, and turned the result into a framework engineering, product design, and the design system team now score against.',
        problem: 'Five internal authoring tools had each grown their own conventions over time, with no shared standard for usability or content quality across them. Those inconsistencies slowed teams down and made the tools harder to trust.',
        roleTags: ['Rubric Design', 'Tool Audit', 'Scoring Framework', 'Cross-Team Rollout'],
        meta: [
          { label: 'Role', val: 'UX & Product Intern' },
          { label: 'Team', val: 'Content Strategy' },
          { label: 'Year', val: 'May 2026 – Aug 2026' }
        ],
        logo: 'Pluralsight logo.png',
        cover: 'pluralsight cover .JPG',
        accent: '#ff1575',
        hasCase: true
      },
      {
        id: 'digital-divide',
        eyebrow: '02 / University of North Texas',
        title: 'Bridging the Digital Divide',
        desc: 'Ten participants from North Texas ran structured usability sessions across websites, mobile apps, and device settings. Recurring failures, including small touch targets, cluttered layouts, and unclear iconography, pointed to four strategies: simplified navigation, larger UI elements, contextual guidance, and voice interaction.',
        problem: 'Older adults are increasingly expected to navigate websites, apps, and device settings that were never designed with them in mind. Small touch targets, cluttered layouts, and unclear iconography turn routine tasks into obstacles: a usability gap mainstream UX research largely overlooks.',
        roleTags: ['Usability Testing', 'Participant Recruiting', 'Accessibility Research', 'Findings Synthesis'],
        meta: [
          { label: 'Role', val: 'Researcher' },
          { label: 'Year', val: '2025' },
          { label: 'Type', val: 'Undergraduate thesis' }
        ],
        cta: { href: 'Thesis.pdf', text: 'Read Thesis (PDF)' },
        logo: 'UNT logo.png',
        accent: '#00843d',
        hasCase: true
      },
      {
        id: 'untitled',
        eyebrow: '03 / Untitled',
        title: 'In Progress',
        desc: 'Documentation underway. This slot holds the next case study.',
        hasCase: false
      }
    ];

    const sc = document.getElementById('sc');
    const railTrack = document.getElementById('rail-track');

    /* ── Build gallery ─────────────────────── */
    projects.forEach((p, i) => {
      const slab = document.createElement('section');
      slab.className = 'pj-slab' + (p.hasCase ? '' : ' no-case');
      if (p.accent) slab.style.setProperty('--accent', p.accent);

      const metaHTML = p.meta ? `
        <div class="pj-meta" style="grid-template-columns:repeat(${p.meta.length},1fr)">
          ${p.meta.map((m, mi) => `
            <div class="pj-meta-item">
              <div class="mono muted">${m.label}</div>
              <div class="pj-meta-val">${m.val}</div>
            </div>`).join('')}
        </div>` : '';

      const footerHTML = !p.meta ? `
        <div class="pj-footer">
          <div class="mono muted">Location: my actual room</div>
          <a class="mono" href="creativeprojects.html#contact-resume">Contact ↗</a>
        </div>` : '';

      slab.innerHTML = `
        <div></div>
        <div class="pj-text">
          <div class="pj-text-main">
            <div class="mono pj-eyebrow">${p.eyebrow}</div>
            <h2>${p.title}</h2>
            <p>${p.desc}</p>
            ${p.hasCase ? '<div class="mono pj-open-cue">View Case Study →</div>' : ''}
          </div>
          ${metaHTML}
          ${footerHTML}
        </div>
        <div class="pj-media">${p.logo ? `<img src="${encodeURI(p.logo)}" alt="${p.eyebrow.split('/')[1].trim()} logo">` : ''}</div>`;

      if (p.hasCase) {
        slab.addEventListener('click', (e) => {
          if (e.target.closest('a')) return;
          openCase(i);
        });
      }
      sc.appendChild(slab);

      const btn = document.createElement('button');
      btn.className = 'mono rail-btn';
      btn.textContent = String(i + 1).padStart(2, '0');
      if (p.accent) btn.style.setProperty('--accent', p.accent);
      btn.addEventListener('click', () => scrollToProject(i));
      railTrack.appendChild(btn);
    });

    /* vertically center each logo against its own text block, not the full panel */
    function positionMediaLogos() {
      document.querySelectorAll('.pj-slab').forEach(slab => {
        const img = slab.querySelector('.pj-media img');
        const textMain = slab.querySelector('.pj-text-main');
        if (!img || !textMain) return;
        const slabRect = slab.getBoundingClientRect();
        const textRect = textMain.getBoundingClientRect();
        img.style.top = (textRect.top - slabRect.top + textRect.height / 2) + 'px';
      });
    }
    positionMediaLogos();
    window.addEventListener('resize', positionMediaLogos);
    window.addEventListener('load', positionMediaLogos);
    if (document.fonts) document.fonts.ready.then(positionMediaLogos);

    const marker = document.createElement('div');
    marker.className = 'rail-marker';
    railTrack.prepend(marker);
    const railBtns = [...railTrack.querySelectorAll('.rail-btn')];

    function setActive(i) {
      railBtns.forEach((b, j) => b.classList.toggle('active', j === i));
      marker.style.transform = `translateY(${i * 36}px)`;
      marker.style.background = projects[i].accent || 'var(--color-accent)';
    }
    setActive(0);

    function scrollToProject(i) {
      sc.scrollTo({ top: i * sc.clientHeight, behavior: 'smooth' });
    }

    let scTicking = false;
    sc.addEventListener('scroll', () => {
      if (scTicking) return;
      scTicking = true;
      requestAnimationFrame(() => {
        const i = Math.min(projects.length - 1, Math.round(sc.scrollTop / sc.clientHeight));
        setActive(i);
        scTicking = false;
      });
    });

    /* ── Case overlay ──────────────────────── */
    const caseEl      = document.getElementById('case');
    const caseScroll   = document.getElementById('case-scroll');
    const caseContent  = document.getElementById('case-content');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let caseOpen = false;
    let lenis = null;
    let rafId = null;

    function caseHTML(p) {
      const metaHTML = p.meta ? `
        <div class="case-meta" style="grid-template-columns:repeat(${p.meta.length},1fr)">
          ${p.meta.map(m => `
            <div class="case-meta-item">
              <div class="mono muted">${m.label}</div>
              <div class="case-meta-val">${m.val}</div>
            </div>`).join('')}
        </div>` : '';
      const hasSummary = p.problem || (p.roleTags && p.roleTags.length);
      const summaryHTML = hasSummary ? `
        <section class="case-summary">
          <div class="case-summary-inner">
            ${p.problem ? `<div><div class="case-problem-label">${p.eyebrow.split('/')[1].trim()}</div><p class="case-summary-text">${p.problem}</p></div>` : ''}
            ${p.roleTags && p.roleTags.length ? `<div><div class="mono case-summary-label">My Role</div><ul class="case-role-tags">${p.roleTags.map(t => `<li>${t}</li>`).join('')}</ul></div>` : ''}
          </div>
        </section>` : '';
      const heroHTML = `
        <section class="case-hero${p.cover ? ' has-cover' : ''}">
          ${p.cover ? `<div class="case-hero-bg" style="background-image:url('${encodeURI(p.cover)}')"></div><div class="case-hero-fade"></div>` : ''}
          <div class="mono case-eyebrow">${p.eyebrow}</div>
          <h1 class="case-title">${p.title}</h1>
          <div class="mono case-scrollcue">Scroll ↓</div>
        </section>`;
      return `
        ${hasSummary ? `<div class="case-stack">${heroHTML}${summaryHTML}</div>` : heroHTML}
        <section class="case-body">
          ${!hasSummary ? `<p class="case-desc">${p.desc}</p>` : ''}
          ${metaHTML}
          <div class="case-media">${p.logo ? `<img src="${encodeURI(p.logo)}" alt="${p.eyebrow.split('/')[1].trim()} logo">` : ''}</div>
          ${p.cta ? `<a class="case-cta" href="${p.cta.href}" target="_blank" rel="noopener">${p.cta.text}</a>` : ''}
        </section>
        <section class="case-end">
          <button onclick="closeCase()">← Back to Gallery</button>
        </section>`;
    }

    function pluralsightCaseHTML(p) {
      return `
        <div class="case-stack">
          <section class="case-hero has-cover ps-cover">
            <div class="case-hero-bg" style="background-image:url('${encodeURI(p.cover)}')"></div>
            <div class="case-hero-fade"></div>
            <div class="mono case-eyebrow">${p.eyebrow}</div>
            <h1 class="case-title">${p.title}</h1>
            <div class="mono case-scrollcue">Scroll ↓</div>
          </section>
          <section class="ps-hero ps-case">
            <div class="ps-hero-main">
              <div class="ps-eyebrow">PLURALSIGHT</div>
              <p class="ps-lede">I led a systematic UX and content audit across a complex internal authoring tool suite, covering five distinct software products used for content creation. The goal was to evaluate these separate tools against the corporate design system, brand voice guidelines, and AI UX principles to determine if they could function as a cohesive "one-stop shop" for a sequential content workflow.</p>
            </div>
            <div class="ps-provided">
              <div class="ps-provided-label">I provided</div>
              <div class="ps-provided-list">
                <div>UX/UI AUDITING + STRATEGY</div>
                <div>PRODUCT MANAGEMENT</div>
                <div>AI UX DEVELOPMENT</div>
              </div>
            </div>
          </section>
        </div>
        <div class="ps-case">

          <section class="ps-section">
            <div class="ps-section-text">
              <h2 class="ps-heading">Making sense of a fragmented ecosystem</h2>
              <p class="ps-body">The authoring suite consisted of five distinct tools, some acquired and others built internally by a tight-knit team of about six creative technologists. Because these technologists were rapidly developing different tools simultaneously, the suite had become visually and functionally inconsistent. Furthermore, with the company's first in-house introduction of AI features, there were no existing UI patterns or corporate design system standards to govern these new interfaces. The challenge was to bring cohesion to this ecosystem without stifling the team's ongoing development.</p>
            </div>
            <div class="ps-section-media"><svg viewBox="0 0 566 453" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="">
              <rect x="44" y="58" width="375" height="315" fill="#1a0510"/>
              <circle cx="63" cy="77" r="4" fill="#ff1575"/>
              <circle cx="76" cy="77" r="4" fill="#726069"/>
              <circle cx="89" cy="77" r="4" fill="#726069"/>
              <g fill="#ffffff">
                <rect x="59" y="95" width="8" height="3" rx="1.5" fill="#01853e"/>
                <rect x="75" y="95" width="161" height="3" rx="1.5" opacity="0.5"/>
                <rect x="75" y="108" width="192" height="3" rx="1.5" opacity="0.3"/>
                <rect x="75" y="121" width="110" height="3" rx="1.5" opacity="0.3"/>
                <rect x="59" y="134" width="8" height="3" rx="1.5" fill="#01853e"/>
                <rect x="75" y="134" width="100" height="3" rx="1.5" opacity="0.5"/>
                <rect x="75" y="147" width="173" height="3" rx="1.5" fill="#ff1575" opacity="1"/>
                <rect x="75" y="160" width="76" height="3" rx="1.5" opacity="0.4"/>
                <rect x="59" y="177" width="8" height="3" rx="1.5" fill="#01853e"/>
                <rect x="75" y="173" width="9" height="10" rx="1.5" opacity="0.5"/>
              </g>
              <rect x="256" y="206" width="114" height="9" rx="3" fill="#1a0510"/>
              <rect x="256" y="221" width="148" height="2" fill="#dcd9db"/>
              <rect x="469" y="206" width="32" height="32" rx="7" fill="none" stroke="#ff8ab4" stroke-width="2"/>
              <rect x="480" y="217" width="11" height="11" rx="2" fill="#ff1575"/>
              <rect x="256" y="252" width="245" height="86" fill="none" stroke="#e2e0e1" stroke-width="1.5"/>
              <line x1="374" y1="253" x2="374" y2="337" stroke="#e2e0e1" stroke-width="1.5"/>
              <rect x="385" y="252" width="116" height="86" fill="#f5e9ec"/>
              <rect x="266" y="321" width="98" height="2" fill="#cbc7c9"/>
              <rect x="266" y="327" width="70" height="2" fill="#cbc7c9"/>
              <rect x="393" y="306" width="10" height="23" fill="#1a0510"/>
              <rect x="406" y="290" width="10" height="39" fill="#1a0510"/>
              <rect x="419" y="275" width="10" height="54" fill="#ff1575"/>
              <rect x="256" y="352" width="165" height="23" rx="3" fill="#1a0510"/>
              <rect x="429" y="352" width="73" height="25" rx="3" fill="none" stroke="#1a0510" stroke-width="1.5"/>
            </svg></div>
          </section>

          <section class="ps-section bg-pink reverse">
            <div class="ps-section-text">
              <h2 class="ps-heading">Establishing a single source of truth</h2>
              <p class="ps-body">As the sole driver of this audit, I needed to establish a rigorous, objective baseline before evaluating. I developed a User Journey Framework detailing requirements for AI UX best practices, design system adherence, and ecosystem cohesion. I presented this to the team, and leadership formally adopted it as our operating standard. From there, I created a 22-criterion weighted audit scorecard, heavily prioritizing AI autonomy and cross-tool consistency to enable precise, side-by-side comparisons of the entire suite.</p>
            </div>
            <div class="ps-section-media"><svg viewBox="0 0 474 379" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="">
              <g fill="none" stroke="#908086" stroke-width="1.4">
                <line x1="0" y1="189" x2="474" y2="189"/>
                <rect x="59.5" y="162" width="53" height="54"/>
                <rect x="127" y="162" width="53" height="54"/>
                <rect x="294" y="162" width="53" height="54"/>
                <rect x="361" y="162" width="53" height="53.5"/>
                <line x1="86.5" y1="216" x2="86.5" y2="242"/>
                <line x1="153.5" y1="216" x2="153.5" y2="242"/>
                <line x1="320.5" y1="216" x2="320.5" y2="242"/>
                <line x1="387.5" y1="216" x2="387.5" y2="242"/>
              </g>
              <rect x="210.5" y="162" width="53" height="54" fill="#ff1575"/>
              <g stroke="#ff1575" stroke-width="2">
                <line x1="237" y1="109" x2="237" y2="136"/>
                <line x1="237" y1="243" x2="237" y2="269"/>
              </g>
            </svg></div>
          </section>

          <section class="ps-section ps-collab">
            <div class="ps-section-text">
              <h2 class="ps-heading">Building context through collaboration</h2>
              <p class="ps-body">Building context quickly during a short internship initially felt like a roadblock, but I soon realized my unfamiliarity was my greatest asset. A fresh perspective allowed me to spot interface inconsistencies the team had naturally grown accustomed to. However, identifying the friction was only half the work. I needed to step outside my immediate team to understand the technical and strategic reasons behind it. I made relationship-building a priority, initiating outreach to senior designers to understand the corporate design system and partnering with colleagues to integrate accessibility research. By actively engaging with disciplines ranging from rotating engineers to the VP of Architecture, I ensured the work remained aligned with the organization's bigger picture.</p>
            </div>
            <div class="ps-section-media ps-collab-media"><img src="collaboration.JPG" alt=""></div>
          </section>

          <section class="ps-section">
            <div class="ps-grid12">
              <div class="ps-col-mid8">
                <h2 class="ps-heading">Designing for reality, not just aesthetics</h2>
                <p class="ps-body">Good UX has to actually be buildable. Working alongside a small team of creative technologists, I realized my job wasn't just to point out interface flaws, but to help connect the dots between their parallel projects. I took a solution-first approach by taking the time to learn the underlying technical architecture. For example, I set up the full-stack local environment for a new beta tool myself so I could run a hands-on QA audit. Because I understood how the tools were built under the hood, I could ensure every UX recommendation and AI pattern I proposed was actually feasible for the engineering team to execute.</p>
              </div>
            </div>
          </section>

          <section class="ps-section ps-section-center">
            <div class="ps-section-text">
              <h2 class="ps-heading">Turning findings into a lasting framework</h2>
              <div class="ps-body ps-body-long">
                <p>By the end of the audit, I had logged over 130 findings across five tools and mapped out entirely new AI UX patterns to guide future development. However, I knew that raw data is only valuable if it actually drives action.</p>
                <p>Halfway through the project, a major organizational shift occurred when the Product and Content orgs merged. Their new shared goal was driving internal tool adoption. This was a pivotal moment for me. I realized that to make my work truly matter, I had to stop framing UX purely as a usability exercise and start pitching it as a core business strategy. I completely reframed my final documentation to show how resolving these specific interface inconsistencies would directly move the needle on their new adoption metrics.</p>
                <p>Looking back, the most rewarding part of this project was its permanence. My strategic roadmap did not just sit in a folder when my internship ended. It became the operational foundation for the team, directly resulting in the launch of a recurring bi-weekly UX sprint to tackle the issues I identified. The experience taught me that successful design is not just about delivering a polished artifact. It is about equipping a team with the clarity and direction they need to keep building long after you step away.</p>
              </div>
            </div>
          </section>
        </div>
        <section class="case-end ps-case-end">
          <button onclick="closeCase()">← Back to Gallery</button>
        </section>`;
    }

    function startLenis() {
      if (typeof Lenis === 'undefined' || reducedMotion) return;
      lenis = new Lenis({ wrapper: caseScroll, content: caseContent, duration: 1.25, smoothWheel: true });
      const raf = (t) => { if (!lenis) return; lenis.raf(t); rafId = requestAnimationFrame(raf); };
      rafId = requestAnimationFrame(raf);
    }
    function stopLenis() {
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      if (lenis) { lenis.destroy(); lenis = null; }
    }

    function openCase(i, pushHash = true) {
      const p = projects[i];
      if (!p.hasCase) return;
      caseEl.style.setProperty('--accent', p.accent || '');
      caseContent.innerHTML = p.id === 'pluralsight' ? pluralsightCaseHTML(p) : caseHTML(p);
      caseScroll.scrollTop = 0;
      caseEl.classList.add('open');
      caseOpen = true;
      startLenis();
      if (pushHash) history.pushState({ project: p.id }, '', '#' + p.id);
      document.title = p.title;
    }

    function closeCase(viaHistory = false) {
      if (!caseOpen) return;
      caseEl.classList.remove('open');
      caseOpen = false;
      stopLenis();
      document.title = 'Projects';
      if (!viaHistory && location.hash) history.back();
    }

    document.getElementById('case-close').addEventListener('click', () => closeCase());
    document.addEventListener('keydown', e => { if (caseOpen && e.key === 'Escape') closeCase(); });

    window.addEventListener('popstate', () => {
      const id = location.hash.slice(1);
      const idx = projects.findIndex(p => p.id === id);
      if (idx >= 0) openCase(idx, false);
      else closeCase(true);
    });

    const initialId = location.hash.slice(1);
    const initialIdx = projects.findIndex(p => p.id === initialId);
    if (initialIdx >= 0) openCase(initialIdx, false);
  </script>
</body>
</html>
